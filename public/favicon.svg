<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Subtle Circuit Grid Lines -->
  <path d="M 110 256 L 190 256 M 322 256 L 402 256 M 256 110 L 256 175 M 256 325 L 256 402" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.35" />
  <circle cx="110" cy="256" r="10" fill="#38bdf8" opacity="0.6" />
  <circle cx="402" cy="256" r="10" fill="#38bdf8" opacity="0.6" />
  <circle cx="256" cy="110" r="10" fill="#38bdf8" opacity="0.6" />
  <circle cx="256" cy="402" r="10" fill="#38bdf8" opacity="0.6" />

  <!-- Main Graduation Cap Symbol -->
  <g transform="translate(0, -10)" filter="url(#glow)">
    <!-- Cap Diamond Top -->
    <polygon points="256,150 410,220 256,290 102,220" fill="url(#iconGrad)" />
    <!-- Cap Under Base -->
    <path d="M 160 252 L 160 310 C 160 355 352 355 352 310 L 352 252" fill="none" stroke="url(#iconGrad)" stroke-width="26" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M 380 220 L 416 320" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" />
    <circle cx="416" cy="330" r="14" fill="#fbbf24" />
    <!-- Center Star Sparkle -->
    <polygon points="256,198 262,214 278,220 262,226 256,242 250,226 234,220 250,214" fill="#ffffff" />
  </g>
</svg>
